/* ================= derived ================= */
const sub=e=>gstBreak(e).taxable;   // value before GST (service + items sold)
const gstAmt=e=>gstBreak(e).tax;
const net=e=>gstBreak(e).total;
const paid=e=>sum(e.payments||[],p=>(+p.amount||0)+(+p.tds||0));
const due=e=>e.status==='cancelled'||e.status==='enquiry'?0:Math.max(0,net(e)-paid(e));
// Order cost = bills for the order (excluding wage payments) + wages earned on the order from the work log
const labour=e=>sum(S.shifts.filter(s=>s.eventId===e.id),s=>s.amount);
const cost=e=>sum(S.expenses.filter(x=>x.eventId===e.id&&!x.workerId),x=>x.amount)+labour(e);
// Workers are Salaried (fixed monthly salary, due at each month end) or Contract (amount entered per work day)
const wCat=w=>w?(w.cat||(w.wageType==='Monthly'?'Salaried':'Contract')):'Contract';
const isSal=w=>wCat(w)==='Salaried';
const isGrp=w=>wCat(w)==='Group';
const heads=s=>{const w=wkr(s.workerId);return isGrp(w)?(+s.heads||+w.size||1):1};
const wIcon=w=>isGrp(w)?'👥':isSal(w)?'💼':'👷';
const wShifts=id=>S.shifts.filter(s=>s.workerId===id);
const wPaid=id=>sum(S.expenses.filter(x=>x.workerId===id),x=>x.amount);
function salaryStart(w){if(w.joined)return w.joined;const d=[...wShifts(w.id).map(s=>s.date),...S.expenses.filter(x=>x.workerId===w.id).map(x=>x.date)].sort()[0];return d||today()}
function salaryRows(w){if(!w||!isSal(w)||!(+w.wage))return[];const sal=+w.wage,st=new Date(salaryStart(w)+'T00:00'),now=new Date(today()+'T00:00'),out=[];
  for(let i=0;i<600;i++){const ms=new Date(st.getFullYear(),st.getMonth()+i,1),me=new Date(st.getFullYear(),st.getMonth()+i+1,0);if(me>=now)break;
    const dim=me.getDate(),first=i===0&&st.getDate()>1,a=Math.round(first?sal*(dim-st.getDate()+1)/dim:sal);
    out.push({d:iso(me),a,lab:ms.toLocaleDateString(loc(),{month:'short',year:'numeric'})+(first?' ('+(dim-st.getDate()+1)+' '+T('days')+')':'')})}
  return out}
const wEarned=id=>{const w=wkr(id);return sum(wShifts(id).filter(s=>s.date<=today()),s=>s.amount)+sum(salaryRows(w),r=>r.a)};
const wUpcoming=id=>sum(wShifts(id).filter(s=>s.date>today()),s=>s.amount);
const wDue=id=>wEarned(id)-wPaid(id);
const wRate=w=>w&&!isSal(w)?(+w.wage||0):0;
const noAmt=s=>!isSal(wkr(s.workerId))&&!(+s.amount)&&(+s.days)>0;
const wagesDue=()=>sum(S.workers,w=>Math.max(0,wDue(w.id)));
const allPay=()=>S.events.flatMap(e=>(e.payments||[]).map(p=>({...p,ev:e})));
const live=e=>e.status!=='cancelled'&&e.status!=='enquiry';
const stLabel={enquiry:['Enquiry','enq'],confirmed:['Confirmed',''],done:['Done','done'],cancelled:['Cancelled','can']};

/* ================= periods ================= */
const fyStart=d=>{const y=+d.slice(0,4),m=+d.slice(5,7);return m>=4?y:y-1};
const fyLabel=y=>y+'-'+String((y+1)%100).padStart(2,'0');
function period(P){const a=new Date(P.anchor+'T00:00');
  if(P.kind==='month'){const f=new Date(a.getFullYear(),a.getMonth(),1),t=new Date(a.getFullYear(),a.getMonth()+1,0);return{from:iso(f),to:iso(t),label:f.toLocaleDateString(loc(),{month:'long',year:'numeric'})}}
  if(P.kind==='quarter'){const cq=Math.floor(a.getMonth()/3);const f=new Date(a.getFullYear(),cq*3,1),t=new Date(a.getFullYear(),cq*3+3,0);return{from:iso(f),to:iso(t),label:'Q'+((cq+3)%4+1)+' FY '+fyLabel(fyStart(iso(f)))+' · '+f.toLocaleDateString(loc(),{month:'short'})+'–'+t.toLocaleDateString(loc(),{month:'short'})}}
  if(P.kind==='fy'){const y=fyStart(P.anchor);return{from:y+'-04-01',to:(y+1)+'-03-31',label:'FY '+fyLabel(y)}}
  return{from:'0000-01-01',to:'9999-12-31',label:T('All time')}}
function shift(P,dir){const a=new Date(P.anchor+'T00:00');a.setDate(1);a.setMonth(a.getMonth()+dir*({month:1,quarter:3,fy:12}[P.kind]||0));P.anchor=iso(a);render()}

  const have=S.shifts.filter(s=>s.eventId===e.id);
  ids.forEach(id=>{const sh=have.find(s=>s.workerId===id),a=amts[id];
    if(sh){if(a!==undefined&&a!==+sh.amount){sh.amount=a;sh.rate=sh.days?Math.round(a/sh.days):a}if(hd[id])sh.heads=hd[id]}
    else{const amt=a!==undefined?a:wRate(wkr(id));const n=stamp({id:uid(),workerId:id,eventId:e.id,date:e.date,place:e.venue||'',days:1,rate:amt,amount:amt});if(hd[id])n.heads=hd[id];S.shifts.push(n)}});
  const drop=have.filter(s=>!ids.includes(s.workerId));
  if(drop.length){if(can.del())S.shifts=S.shifts.filter(s=>!drop.includes(s));else{drop.forEach(s=>{s.days=0;s.amount=0});toast('Set to 0 days — only the owner can remove')}}}

const MAX_BYTES=450e3;
const IDB={db:null,open(){return this.db||(this.db=new Promise((res,rej)=>{const r=indexedDB.open('caterbook-bills',1);r.onupgradeneeded=()=>r.result.createObjectStore('b');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async op(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('b',mode);const r=fn(t.objectStore('b'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})}};
const Bills={
  put:(id,b)=>CLOUD?CloudFB.putBill(id,b):IDB.op('readwrite',s=>s.put(b,id)),
  get:id=>CLOUD?CloudFB.getBill(id):IDB.op('readonly',s=>s.get(id)),
  del:id=>CLOUD?(isOwn()?CloudFB.delBill(id):Promise.resolve()):IDB.op('readwrite',s=>s.delete(id))};
const readURL=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Could not read this image'));i.src=src});
function drawJpeg(img,max,q){const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}
const b64len=d=>Math.round((d.length-d.indexOf(',')-1)*3/4);
async function compress(file){
  if(file.type==='application/pdf'){if(file.size>700e3)throw new Error('PDF is larger than 700 KB — take a photo instead');const data=await readURL(file);return{data,mime:'application/pdf',size:file.size,orig:file.size,thumb:''}}
  const src=URL.createObjectURL(file);const img=await loadImg(src);URL.revokeObjectURL(src);
  let max=1600,q=.72,data=drawJpeg(img,max,q);
  while(b64len(data)>MAX_BYTES&&max>700){max=Math.round(max*.82);q=Math.max(.5,q-.06);data=drawJpeg(img,max,q)}
  return{data,mime:'image/jpeg',size:b64len(data),orig:file.size,thumb:drawJpeg(img,160,.6)}}
let ATT=null; // {list:[meta], added:{id:bill}, removed:[ids]}
function attEditor(list){ATT={list:[...(list||[])],added:{},removed:[]};
  return `<label>📎 ${T('Attach bill')}</label><div class="atts" id="attl"></div>
  <div class="attbtns"><label>📷 ${T('Camera')}<input type="file" accept="image/*" capture="environment" hidden onchange="attAdd(this)"></label><label>🖼️ ${T('Gallery / PDF')}<input type="file" accept="image/*,application/pdf" multiple hidden onchange="attAdd(this)"></label></div>`}
function attDraw(){const el=$('#attl');if(!el)return;el.innerHTML=ATT.list.map(a=>`<div class="att" onclick="viewBill('${a.id}')">${a.thumb?`<img src="${a.thumb}">`:'📄'}<button type="button" class="x" onclick="event.stopPropagation();attRemove('${a.id}')">×</button></div>`).join('')}
async function attAdd(inp){for(const f of inp.files){try{const b=await compress(f);const id=uid();ATT.added[id]=b;ATT.list.push({id,mime:b.mime,size:b.size,thumb:b.thumb});toast(`${Math.round(b.orig/1024)} KB → ${Math.round(b.size/1024)} KB`)}catch(e){toast(e.message)}}inp.value='';attDraw()}
function attRemove(id){ATT.list=ATT.list.filter(a=>a.id!==id);if(ATT.added[id])delete ATT.added[id];else ATT.removed.push(id);attDraw()}
async function attCommit(){if(!ATT)return[];const by=me().name;
  for(const[id,b] of Object.entries(ATT.added)){try{await Bills.put(id,{data:b.data,mime:b.mime,size:b.size,by})}catch(e){err(e)}}
  ATT.removed.forEach(id=>Bills.del(id).catch(()=>{}));const l=ATT.list;ATT=null;return l}

function assetValue(a){const c=+a.cost||0;if(!a.bought)return c;const y=Math.max(0,(Date.now()-new Date(a.bought))/(365.25*864e5));return c*Math.pow(1-(+a.dep||0)/100,y)}
function polStatus(p){if(!p.expiry)return['Valid','done'];if(p.expiry<today())return['Expired','due'];if(p.expiry<=addDays(30))return['Expiring soon','enq'];return['Valid','done']}

/* ---- storage ---- */
function storageStats(){const all=['expenses','assets','policies'].flatMap(k=>S[k].flatMap(x=>x.att||[]));const bytes=sum(all,a=>a.size)*1.34;
  const cut=addDays(-90),recent=S.expenses.filter(x=>x.date>=cut).flatMap(x=>x.att||[]);const perMonth=sum(recent,a=>a.size)*1.34/3;
  return{n:all.length,bytes,perMonth,avg:all.length?bytes/all.length:0,label:all.length+' · '+(bytes/1048576).toFixed(1)+' MB'}}
function storageV(){const s=storageStats(),cap=1073741824,dataMB=JSON.stringify(Object.fromEntries(COLLS.map(c=>[c,S[c].map(x=>({...x,att:undefined}))]))).length/1048576;
  const used=s.bytes+dataMB*1048576*1.5,left=cap-used,months=s.perMonth?left/s.perMonth:0;
  return `<div class="kpis">${kpi(T('Bills'),s.n,'',s.avg?'avg '+Math.round(s.avg/1024)+' KB each':'')}${kpi(T('Storage used'),(used/1048576).toFixed(1)+' MB','',(used/cap*100).toFixed(1)+'% of free 1 GB')}${kpi('Added per month',(s.perMonth/1048576).toFixed(1)+' MB','',months?'free space lasts ~'+(months>120?'10+ years':Math.round(months)+' months'):'')}</div>
  <div class="card"><div class="bar" style="height:12px"><i style="width:${Math.max(1,used/cap*100)}%"></i></div><div class="mut" style="margin-top:8px">Records ${dataMB.toFixed(2)} MB · Bills ${(s.bytes/1048576).toFixed(1)} MB</div></div>
  <h2>How bills are stored</h2><div class="card mut" style="font-size:14px;line-height:1.55">A phone photo of a bill is usually 2–5 MB. The app shrinks it to about 150–300 KB before saving, which is still easy to read. PDFs are kept as they are (up to 700 KB).<br><br>
  ${CLOUD?'Bills are saved in your Firebase database, which is free up to 1 GB. Only the person who opens a bill downloads it.':'Bills are saved on this phone. Turn on cloud sync to keep them safe if the phone is lost.'}<br><br>
  Rough guide: 100 bills a month ≈ 25 MB a month ≈ 300 MB a year — about 3 years in the free 1 GB.</div>`}

function snaps(){try{return JSON.parse(localStorage.getItem(SNAP)||'[]')}catch(e){return[]}}
function autoSnap(){if(CLOUD||!S.autoBackup)return;const L=snaps(),d=today();if(L[0]&&L[0].d===d)return;if(!S.events.length&&!S.expenses.length)return;
  L.unshift({d,data:JSON.stringify(S)});try{localStorage.setItem(SNAP,JSON.stringify(L.slice(0,7)))}catch(e){try{localStorage.setItem(SNAP,JSON.stringify(L.slice(0,3)))}catch(e2){}}
  if(window.AndroidBridge&&AndroidBridge.saveFile){try{AndroidBridge.saveFile('catering-backup-'+d+'.json',JSON.stringify(S));S.lastBackup=new Date().toISOString();save()}catch(e){}}}
function cloudDailyFile(){if(!CLOUD||!isOwn()||!S.autoBackup)return;const k='caterbook.lastfile',d=today();if(localStorage.getItem(k)===d)return;
  if(window.AndroidBridge&&AndroidBridge.saveFile&&S.events.length){try{AndroidBridge.saveFile('catering-backup-'+d+'.json',backupJSON());localStorage.setItem(k,d)}catch(e){}}}

function dl(name,text,type){if(window.AndroidBridge&&AndroidBridge.saveFile){try{AndroidBridge.saveFile(name,text);toast('Saved to Downloads: '+name);return}catch(e){}}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function backup(){dl('catering-backup-'+today()+'.json',backupJSON(),'application/json');if(!CLOUD){S.lastBackup=new Date().toISOString();save()}render()}
function applyData(d){if(!Array.isArray(d.events))throw 0;const nd=Object.assign(fresh(),d.cats&&d.cats[0]&&d.cats[0].id?d:migrateV1(d));
  if(CLOUD){COLLS.forEach(c=>{S[c]=nd[c]||[]});SETTING_KEYS.forEach(k=>S[k]=nd[k]);save()}else{S=nd;save()}page=null;tab='home';close();render()}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(confirm(`Restore ${d.events.length} orders and ${d.expenses.length} expenses? This replaces current data${CLOUD?' for everyone':''}.`))applyData(d)}catch(e){alert('That file is not a valid backup.')}};r.readAsText(f)}
function restoreSnap(i){const s=snaps()[i];if(s&&confirm('Restore the copy from '+fd(s.d)+'? Current data will be replaced.'))applyData(JSON.parse(s.data))}
function csv(){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const rows=[['Date','Type','Order / customer','Category','Vendor / worker','Vehicle','Amount','Mode','Note','Entered by']];

    x.lines=IT.filter(t=>t[5]).map(([n,,u,,base,share])=>{const rate=Math.round(base*inf*100)/100,amt=Math.round(x.amount*share),q=Math.round(amt/rate*10)/10;return{name:n,itemId:itm(n).id,qty:q,unit:u,rate,amount:Math.round(q*rate)}});x.amount=sum(x.lines,l=>l.amount)});
  S.expenses.filter(x=>x.cat==='Gas / fuel'&&x.eventId).forEach(x=>{const age=(new Date(today())-new Date(x.date))/864e5,rate=Math.round(1750*(1+(160-age)*.0005));const q=Math.max(1,Math.round(x.amount/rate));x.amount=q*rate;x.lines=[{name:'LPG commercial 19kg',itemId:itm('LPG commercial 19kg').id,qty:q,unit:'cylinder',rate,amount:q*rate}]});
  const odo={};S.expenses.filter(x=>x.cat==='Vehicle fuel'&&x.vehicleId).sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>{const age=(new Date(today())-new Date(x.date))/864e5,rate=Math.round((89+(160-age)*.02)*100)/100;
    const q=Math.max(10,Math.round(x.amount/rate));x.amount=Math.round(q*rate);x.qty=q;x.unit='L';odo[x.vehicleId]=(odo[x.vehicleId]||(x.vehicleId===S.vehicles[0].id?48200:91500))+q*(x.vehicleId===S.vehicles[0].id?13.5:10.2);x.odo=Math.round(odo[x.vehicleId]);
    x.lines=[{name:'Diesel',qty:q,unit:'L',rate,amount:x.amount}]});
  S.events.filter(e=>live(e)&&e.date<=today()).forEach(e=>{IT.forEach(([n,,u])=>{const bought=sum(S.expenses.filter(x=>x.eventId===e.id).flatMap(x=>x.lines||[]).filter(l=>l.name===n),l=>l.qty);if(bought)S.stock.push({id:uid(),itemId:itm(n).id,type:'out',qty:Math.round(bought*.97*10)/10,date:e.date,eventId:e.id,by:'Manju'})})});
  S.stock.push({id:uid(),itemId:itm('Sugar').id,type:'out',qty:12,date:d(-1),note:'Payasa trial batch',by:'Manju'});
  const gv=S.vendors.find(v=>v.name.startsWith('Sri Ganesh')),vr=S.vendors.find(v=>v.name.startsWith('Ganesh Vessel'));
  S.expenses.filter(x=>x.vendorId===gv.id&&x.date<d(-30)&&x.date>d(-75)).forEach(x=>x.mode='Pay later (credit)');
  const cr=S.expenses.filter(x=>x.vendorId===gv.id&&x.mode==='Pay later (credit)').sort((a,b)=>a.date.localeCompare(b.date));
  if(cr.length>1)S.vpays.push({id:uid(),vendorId:gv.id,date:d(-25),amount:Math.round(sum(cr.slice(0,-2),x=>x.amount)/1000)*1000+5000,mode:'Bank transfer',kind:'payment',note:'Part payment',by:'Owner'});
  S.vpays.push({id:uid(),vendorId:vr.id,date:d(-6),amount:5000,mode:'UPI',kind:'advance',note:'Advance for Shetty wedding vessels',by:'Owner'});
  // enquiries that were lost / cancelled
  [[ -100,'Wedding',600,420,'cancelled','Price too high',''],[-75,'Birthday',120,300,'enquiry','',''],[-60,'Corporate',250,260,'cancelled','Chose another caterer',''],[-40,'Housewarming',180,320,'cancelled','Event cancelled / postponed','c'],[-20,'Engagement',300,400,'cancelled','Date not available',''],[30,'Naming ceremony',150,280,'enquiry','',''],[70,'Wedding',900,460,'enquiry','','']].forEach(([o,type,pl,rt,st,why,conf],i)=>{const c=S.customers[(i*2+1)%S.customers.length];
    S.events.push({id:uid(),customerId:c.id,client:c.name,date:d(o),booked:d(o-25),type,venueType:['Marriage hall','Home','Corporate office','Home','Party hall','Home','Marriage hall'][i],plates:pl,rate:rt,gst:0,status:st,lostReason:why||undefined,confirmedOn:conf?d(o-20):undefined,cancelledOn:st==='cancelled'?d(o-8):undefined,payments:conf?[{id:uid(),date:d(o-20),amount:10000,mode:'UPI',note:'Advance',by:'Owner'}]:[],by:'Owner'})});
  // a serving team supplied by a contractor
  const G={id:uid(),name:'Ramesh serving team',cat:'Group',leader:'Ramesh Naik',size:12,wage:600,role:'Server',phone:'9741055500',area:'Hanumanthanagar',city:'Bengaluru',active:true};S.workers.push(G);
  S.events.filter(e=>live(e)&&+e.plates>=200).forEach((e,i)=>{const h=Math.round(e.plates/25);S.shifts.push({id:uid(),workerId:G.id,eventId:e.id,date:e.date,place:e.venue,days:1,heads:h,amount:h*600+(i%3?0:500),rate:h*600,by:'Manju'})});
  S.shifts.filter(x=>x.workerId===G.id&&x.date<d(-10)).forEach(x=>S.expenses.push({id:uid(),date:d(Math.min(-1,(new Date(x.date)-new Date(today()))/864e5+2)),amount:x.amount,cat:'Serving staff',workerId:G.id,eventId:'',mode:'Cash',note:'Wages',by:'Owner'}));
  S.expenses.push({id:uid(),date:d(-3),amount:4000,cat:'Serving staff',workerId:G.id,eventId:'',mode:'UPI',note:'Advance',by:'Owner'});
  S.gstin='29ABCDE1234F1Z5';S.pan='ABCDE1234F';S.biz='Annapoorna Caterers';S.targetMargin=35;sampleTeam();save()}

/* ================= boot ================= */
function sheet(h){$('#sheet').innerHTML=`<div class="sheet-bg" onclick="if(event.target===this)close()"><div class="sheet">${h}</div></div>`;document.body.style.overflow='hidden'}
function close(){$('#sheet').innerHTML='';document.body.style.overflow='';ATT=null}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.fab!==undefined){addSheet();return}if(b.dataset.t==='ins')insTab='hub';tab=b.dataset.t;page=null;render();window.scrollTo(0,0)};
$('#fab').onclick=()=>{const f=fabAction();f&&f()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
window.onBack=()=>{if(document.querySelector('.viewer')){document.querySelector('.viewer').remove();return true}if($('#sheet').innerHTML){close();return true}if(page){page=null;render();return true}if(tab==='ins'&&insTab!=='hub'){insTab='hub';render();return true}if(tab!=='home'){tab='home';render();return true}return false};
if(CLOUD){gate='loading';render();CloudFB.init(CLOUD.firebase);CloudFB.onAuth(u=>onUser(u).then(()=>{if(AUTH)setTimeout(cloudDailyFile,4000)}))}
else{loadLocal();autoSnap();render()}
